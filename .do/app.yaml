name: sunchron-backend

domains:
  - domain: synchron.foundation
    type: PRIMARY
  - domain: www.synchron.foundation
    type: ALIAS

services:
  - name: web
    github:
      repo: radostinvgeorgiev-commits/sunchron-backend
      branch: main
      deploy_on_push: true
    run_command: npm start
    build_command: npm ci --omit=dev
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    liveness_health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: APP_COMMIT_SHA
        value: ${_self.COMMIT_HASH}
        scope: RUN_TIME
      - key: DIGITALOCEAN_APP_ID
        value: ${APP_ID}
        scope: RUN_TIME
      - key: DIGITALOCEAN_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: DIGITALOCEAN_API_URL
        value: https://api.digitalocean.com/v2
        scope: RUN_TIME
      - key: DIGITALOCEAN_REQUEST_TIMEOUT_MS
        value: "15000"
        scope: RUN_TIME
      - key: DIGITALOCEAN_DASHBOARD_URL
        value: https://cloud.digitalocean.com/
        scope: RUN_TIME
      - key: CLOUDFLARE_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDFLARE_ZONE_NAME
        value: synchron.foundation
        scope: RUN_TIME
      - key: CLOUDFLARE_API_URL
        value: https://api.cloudflare.com/client/v4
        scope: RUN_TIME
      - key: CLOUDFLARE_REQUEST_TIMEOUT_MS
        value: "10000"
        scope: RUN_TIME
      - key: CLOUDFLARE_DASHBOARD_URL
        value: https://dash.cloudflare.com/
        scope: RUN_TIME
      - key: MCP_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: MCP_OAUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: MCP_RESOURCE_URL

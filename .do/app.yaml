name: sunchron-backend

services:
  - name: web
    github:
      repo: radostinvgeorgiev-commits/sunchron-backend
      branch: main
      deploy_on_push: true
    run_command: npm start
    build_command: npm ci --omit=dev
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: OPENSEARCH_HOST
        scope: RUN_TIME
        type: SECRET
      - key: OPENSEARCH_PORT
        scope: RUN_TIME
        type: SECRET
      - key: OPENSEARCH_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: OPENSEARCH_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: AGENT_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AGENT_URL
        scope: RUN_TIME
        type: SECRET

name: sunchron-backend

services:
  - name: web
    github:
      repo: radostinvgeorgiev-commits/sunchron-backend
      branch: main
      deploy_on_push: true
    run_command: npm start
    build_command: npm ci --omit=dev
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    health_check:
      http_path: /health/ready
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    liveness_health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: APP_COMMIT_SHA
        value: ${_self.COMMIT_HASH}
        scope: RUN_TIME
      - key: OPENSEARCH_HOST
        scope: RUN_TIME
        type: SECRET
      - key: OPENSEARCH_PORT
        scope: RUN_TIME
        type: SECRET
      - key: OPENSEARCH_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: OPENSEARCH_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: OPENSEARCH_TLS_REJECT_UNAUTHORIZED
        value: "true"
        scope: RUN_TIME
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_SESSION_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SYNCHRON_TEST_INVITE_CODE
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_REDIRECT_URI
        value: https://synchron.foundation/api/github/callback
        scope: RUN_TIME
      - key: GITHUB_SESSION_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_REPOSITORY
        value: radostinvgeorgiev-commits/sunchron-backend
        scope: RUN_TIME
      - key: SYNCHRON_OWNER_GITHUB_LOGIN
        value: radostinvgeorgiev-commits
        scope: RUN_TIME
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_SESSION_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_REDIRECT_URI
        value: https://synchron.foundation/api/google/callback
        scope: RUN_TIME
      - key: OAUTH_RATE_LIMIT
        value: "60"
        scope: RUN_TIME
      - key: PRIVATE_API_RATE_LIMIT
        value: "300"
        scope: RUN_TIME
      - key: PAID_AI_RATE_LIMIT
        value: "60"
        scope: RUN_TIME

name: Production smoke check

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-smoke-check
  cancel-in-progress: true

env:
  PRODUCTION_ORIGIN: https://cloudaicore.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for exact Google Cloud production commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          consecutive_matches=0
          required_matches=5
          for attempt in $(seq 1 24); do
            response="$(curl --fail --silent --show-error --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "${PRODUCTION_ORIGIN}/health?deployment-check=${GITHUB_RUN_ID}-${attempt}" \
              2>/dev/null || true)"
            actual_commit="$(printf '%s' "${response}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                try { process.stdout.write(String(JSON.parse(input).commit || "")); }
                catch { process.stdout.write(""); }
              });
            ')"
            if [ "${actual_commit}" = "${EXPECTED_COMMIT}" ]; then
              consecutive_matches=$((consecutive_matches + 1))
              echo "Attempt ${attempt}/24: Google Cloud production commit ${actual_commit} is stable ${consecutive_matches}/${required_matches}."
              if [ "${consecutive_matches}" -ge "${required_matches}" ]; then
                exit 0
              fi
              sleep 3
              continue
            fi
            consecutive_matches=0
            echo "Attempt ${attempt}/24: production commit is ${actual_commit:-unknown}; waiting for ${EXPECTED_COMMIT}."
            sleep 15
          done
          echo "Google Cloud production did not stably deploy ${EXPECTED_COMMIT}." >&2
          exit 1

      - name: Check AI CORE public shell
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${PRODUCTION_ORIGIN}/")"
          grep -q '<title>SYNCHRON-X' <<< "${page}"
          grep -q 'href="/ai-core-mark.png"' <<< "${page}"
          grep -q 'src="/work-mode.js?' <<< "${page}"

      - name: Check application health and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${PRODUCTION_ORIGIN}/health" \
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${PRODUCTION_ORIGIN}/health/ready" \
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"'

      - name: Check Firestore and Identity Platform dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            "${PRODUCTION_ORIGIN}/health/storage-report" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const response = JSON.parse(input);
                const report = response.dependencies;
                const checks = report?.checks || {};
                console.log(`storage=${report?.status} firestore=${checks.firestore?.status} identity=${checks.identityPlatform?.status}`);
                if (
                  report?.status !== "healthy" ||
                  checks.firestore?.status !== "healthy" ||
                  checks.firestore?.readOnlyCheck !== true ||
                  checks.identityPlatform?.status !== "healthy" ||
                  checks.identityPlatform?.provider !== "identity-platform"
                ) process.exit(1);
              });
            '

      - name: Check honest Firestore backup boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            "${PRODUCTION_ORIGIN}/health/storage-report" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const report = JSON.parse(input).backups;
                const firestore = report?.checks?.firestore;
                if (
                  report?.status !== "unverified" ||
                  firestore?.status !== "unverified" ||
                  firestore?.readOnlyCheck !== true ||
                  firestore?.restoreTested !== false
                ) process.exit(1);
              });
            '

      - name: Check MCP tool catalog and OAuth challenge
        shell: bash
        run: |
          set -euo pipefail
          catalog_ready=false
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              "${PRODUCTION_ORIGIN}/mcp?catalog-check=${attempt}" 2>/dev/null || true)"
            if printf '%s' "${response}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                try {
                  const tools = JSON.parse(input).result?.tools;
                  const expected = [
                    "get_personal_context",
                    "get_project_context",
                    "talk_to_ai_core",
                    "get_google_cloud_runtime_status",
                    "get_system_configuration",
                    "list_available_capabilities",
                    "list_action_history",
                    "list_tasks",
                    "create_task_draft",
                    "list_projects"
                  ];
                  const names = Array.isArray(tools) ? tools.map((tool) => tool.name) : [];
                  const runtime = tools?.find((tool) => tool.name === "get_google_cloud_runtime_status");
                  const valid =
                    names.length >= expected.length &&
                    new Set(names).size === names.length &&
                    expected.every((name) => names.includes(name)) &&
                    runtime?.annotations?.readOnlyHint === true &&
                    runtime?.securitySchemes?.some((scheme) => scheme.type === "noauth");
                  process.exit(valid ? 0 : 1);
                } catch { process.exit(1); }
              });
            '; then
              catalog_ready=true
              break
            fi
            sleep 10
          done
          test "${catalog_ready}" = "true"

          challenge_headers="$(mktemp)"
          challenge_body="$(mktemp)"
          trap 'rm -f "${challenge_headers}" "${challenge_body}"' EXIT
          challenge_status="$(curl --silent --show-error --max-time 30 \
            --dump-header "${challenge_headers}" \
            --output "${challenge_body}" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_personal_context","arguments":{}}}' \
            "${PRODUCTION_ORIGIN}/mcp")"
          test "${challenge_status}" = "401"
          grep -Eiq '^www-authenticate:.*Bearer.*synchron:read.*error="invalid_token".*error_description="' "${challenge_headers}"
          node -e '
            const { readFileSync } = require("node:fs");
            const result = JSON.parse(readFileSync(process.argv[1], "utf8")).result;
            const challenges = result?._meta?.["mcp/www_authenticate"];
            const valid =
              result?.isError === true &&
              Array.isArray(result.content) &&
              Array.isArray(challenges) &&
              challenges.some((challenge) =>
                challenge.includes("oauth-protected-resource") &&
                challenge.includes("synchron:read") &&
                challenge.includes("error=\"invalid_token\"") &&
                challenge.includes("error_description=\"")
              );
            process.exit(valid ? 0 : 1);
          ' "${challenge_body}"

      - name: Check tester auth policy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            "${PRODUCTION_ORIGIN}/api/auth/session" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const status = JSON.parse(input);
                const configuration = status.configuration || {};
                if (status.configured !== true) process.exit(1);
                if (configuration.projectConnection !== true) process.exit(1);
                if (configuration.sessionProtection !== true) process.exit(1);
                if (status.registrationEnabled !== true) process.exit(1);
              });
            '

      - name: Check workspace authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          status_code="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            --output "${response_file}" --write-out '%{http_code}' "${PRODUCTION_ORIGIN}/api/workspaces")"
          test "${status_code}" = "401"
          node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (response.code !== "AUTH_REQUIRED") process.exit(1);
          ' "${response_file}"

      - name: Publish production verification status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) state="success"; description="Google Cloud production smoke passed." ;;
            failure) state="failure"; description="Google Cloud production smoke failed." ;;
            *) state="error"; description="Google Cloud production smoke did not complete." ;;
          esac
          export state description
          payload="$(node -e '
            process.stdout.write(JSON.stringify({
              state: process.env.state,
              context: "synchron/production-smoke",
              description: process.env.description,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          ')"
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

name: Production smoke check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-smoke-check
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for exact production commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          consecutive_matches=0
          required_matches=5
          for attempt in $(seq 1 24); do
            response="$(curl --fail --silent --show-error --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "https://synchron.foundation/health?deployment-check=${GITHUB_RUN_ID}-${attempt}" \
              2>/dev/null || true)"
            actual_commit="$(printf '%s' "${response}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                try {
                  process.stdout.write(String(JSON.parse(input).commit || ""));
                } catch {
                  process.stdout.write("");
                }
              });
            ')"

            if [ "${actual_commit}" = "${EXPECTED_COMMIT}" ]; then
              consecutive_matches=$((consecutive_matches + 1))
              echo "Attempt ${attempt}/24: production commit ${actual_commit} is stable ${consecutive_matches}/${required_matches}."
              if [ "${consecutive_matches}" -ge "${required_matches}" ]; then
                echo "Production is stably running commit ${actual_commit}"
                exit 0
              fi
              sleep 3
              continue
            fi

            consecutive_matches=0
            echo "Attempt ${attempt}/24: production commit is ${actual_commit:-unknown}; waiting for ${EXPECTED_COMMIT}"
            sleep 15
          done

          echo "Production did not stably deploy commit ${EXPECTED_COMMIT} within the verification window." >&2
          exit 1

      - name: Check AI CORE public shell
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/)"
          grep -q '<title>SYNCHRON-X' <<< "${page}"
          grep -q 'href="/ai-core-mark.png"' <<< "${page}"
          grep -q 'src="/work-mode.js?' <<< "${page}"

      - name: Check application health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/health \
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Check production readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/health/ready \
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"'

      - name: Check Firestore and Identity Platform dependencies
        shell: bash
        run: |
          set -euo pipefail
          dependencies_healthy=false
          for attempt in 1 2 3; do
            if response="$(curl --fail --silent --show-error \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --max-time 30 \
              https://synchron.foundation/health/storage-report)" &&
              printf '%s' "${response}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const report = JSON.parse(input).dependencies;
              const checks = report.checks || {};
              console.log(
                `storage=${report.status} firestore=${checks.firestore?.status}`,
              );
              if (
                report.status !== "healthy" ||
                checks.firestore?.status !== "healthy" ||
                checks.firestore?.backend !== "firestore"
              ) {
                process.exit(1);
              }
            });
            '; then
              dependencies_healthy=true
              break
            fi
            sleep $((attempt * 10))
          done
          test "${dependencies_healthy}" = "true"

      - name: Check Google-managed backup status
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in 1 2 3; do
            if response="$(curl --fail --silent --show-error \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --max-time 30 \
              https://synchron.foundation/health/storage-report)" &&
              printf '%s' "${response}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const report = JSON.parse(input).backups;
                const backup = report.checks?.firestore;
                console.log(
                  `coverage=${report.status} firestore=${backup?.status} managed=${backup?.status === "managed"}`,
                );
                if (
                  report.status !== "not-required" ||
                  backup?.status !== "managed" ||
                  backup?.readOnlyCheck !== true ||
                  backup?.restoreTested !== false
                ) {
                  process.exit(1);
                }
              });
              '; then
              verified=true
              break
            fi
            sleep $((attempt * 10))
          done
          test "${verified}" = "true"

      - name: Check production memory acceptance
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/health/ready)"
          printf '%s' "${response}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const acceptance = JSON.parse(input).checks?.memoryAcceptance;
              console.log(JSON.stringify(acceptance));
              if (
                !acceptance?.required ||
                !acceptance?.ready ||
                acceptance.status !== "works" ||
                acceptance.isolated !== true ||
                acceptance.realMemoryUnchanged !== true ||
                acceptance.cleanupCompleted !== true
              ) {
                process.exit(1);
              }
            });
          '

      - name: Check MCP status
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/health/ready)"
          printf '%s' "${response}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const bridge = JSON.parse(input).checks?.bridge;
              console.log(
                `MCP configured=${Boolean(bridge?.configured)} responding=${Boolean(bridge?.responding)}`,
              );
              if (!bridge?.configured || !bridge?.responding) process.exit(1);
            });
          '

      - name: Check MCP tool catalog and OAuth challenge
        shell: bash
        run: |
          set -euo pipefail
          catalog_ready=false
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error \
              --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              "https://synchron.foundation/mcp?catalog-check=${attempt}" 2>/dev/null || true)"

            if printf '%s' "${response}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                try {
                  const tools = JSON.parse(input).result?.tools;
                  const expected = [
                    "get_personal_context",
                    "get_project_context",
                    "list_synchron_conversations",
                    "get_synchron_conversation",
                    "talk_to_ai_core",
                    "get_github_copilot_task_status",
                    "prepare_github_merged_branch_cleanup",
                    "confirm_github_merged_branch_cleanup",
                  ];
                  const names = Array.isArray(tools) ? tools.map((tool) => tool.name) : [];
                  const tracker = tools?.find(
                    (tool) => tool.name === "get_github_copilot_task_status",
                  );
                  const trackerScopes = tracker?.securitySchemes?.flatMap(
                    (scheme) => scheme.scopes || [],
                  ) || [];
                  const conversation = tools?.find(
                    (tool) => tool.name === "talk_to_ai_core",
                  );
                  const conversationScopes = conversation?.securitySchemes?.flatMap(
                    (scheme) => scheme.scopes || [],
                  ) || [];
                  const valid =
                    names.length >= expected.length &&
                    new Set(names).size === names.length &&
                    expected.every((name) => names.includes(name)) &&
                    tracker?.annotations?.readOnlyHint === true &&
                    trackerScopes.includes("synchron:read") &&
                    conversation?.annotations?.destructiveHint === false &&
                    conversationScopes.includes("synchron:agent.chat");
                  console.log(JSON.stringify({
                    catalogSize: names.length,
                    missingExpected: expected.filter((name) => !names.includes(name)),
                    trackerReadOnly: tracker?.annotations?.readOnlyHint,
                  }));
                  process.exit(valid ? 0 : 1);
                } catch {
                  process.exit(1);
                }
              });
            '; then
              catalog_ready=true
              break
            fi

            echo "Attempt ${attempt}/12: MCP tool catalog is not on the expected version yet."
            sleep 10
          done

          if [ "${catalog_ready}" != "true" ]; then
            echo "Production MCP tool catalog did not reach the expected version." >&2
            exit 1
          fi

          challenge_headers="$(mktemp)"
          challenge_body="$(mktemp)"
          challenge_status="$(curl --silent --show-error \
            --max-time 30 \
            --dump-header "${challenge_headers}" \
            --output "${challenge_body}" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_github_copilot_task_status","arguments":{"issueNumber":83}}}' \
            https://synchron.foundation/mcp)"
          test "${challenge_status}" = "401"
          grep -Eiq '^www-authenticate:.*Bearer.*synchron:read.*error="invalid_token".*error_description="' "${challenge_headers}"
          node -e '
            const { readFileSync } = require("node:fs");
            const response = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const result = response.result;
            const challenges = result?._meta?.["mcp/www_authenticate"];
            const valid =
              result?.isError === true &&
              Array.isArray(result.content) &&
              result.content.some((item) => item?.type === "text") &&
              Array.isArray(challenges) &&
              challenges.some(
                (challenge) =>
                  typeof challenge === "string" &&
                  challenge.includes("oauth-protected-resource") &&
                  challenge.includes("synchron:read") &&
                  challenge.includes("error=\"invalid_token\"") &&
                  challenge.includes("error_description=\""),
              );
            process.exit(valid ? 0 : 1);
          ' "${challenge_body}"

      - name: Check tester auth policy
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/api/auth/session)"
          printf '%s' "${response}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const status = JSON.parse(input);
              const configuration = status.configuration || {};
              const configured = status.configured;
              const projectConnection = configuration.projectConnection;
              const sessionProtection = configuration.sessionProtection;
              const registrationEnabled = status.registrationEnabled;
              console.log(JSON.stringify({
                configured,
                registrationEnabled,
                projectConnection,
                sessionProtection,
              }));
              if (configured !== true) process.exit(1);
              if (projectConnection !== true) process.exit(1);
              if (sessionProtection !== true) process.exit(1);
              if (registrationEnabled !== false) process.exit(1);
            });
          '

      - name: Check workspace authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          status_code="$(curl --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            https://synchron.foundation/api/workspaces)"

          if [ "${status_code}" != "401" ]; then
            echo "Workspace API returned ${status_code}; expected the unauthenticated boundary." >&2
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (response.code !== "AUTH_REQUIRED") process.exit(1);
          ' "${response_file}"

      - name: Publish production verification status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success)
              state="success"
              description="Production smoke check passed."
              ;;
            failure)
              state="failure"
              description="Production smoke check failed."
              ;;
            *)
              state="error"
              description="Production smoke check did not complete."
              ;;
          esac

          export state description
          payload="$(node -e '
            process.stdout.write(JSON.stringify({
              state: process.env.state,
              context: "synchron/production-smoke",
              description: process.env.description,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            }));
          ')"

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

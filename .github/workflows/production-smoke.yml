name: Production smoke check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-smoke-check
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for exact production commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            response="$(curl --fail --silent --show-error --max-time 30 \
              https://synchron.foundation/health 2>/dev/null || true)"
            actual_commit="$(printf '%s' "${response}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                try {
                  process.stdout.write(String(JSON.parse(input).commit || ""));
                } catch {
                  process.stdout.write("");
                }
              });
            ')"

            if [ "${actual_commit}" = "${EXPECTED_COMMIT}" ]; then
              echo "Production is running commit ${actual_commit}"
              exit 0
            fi

            echo "Attempt ${attempt}/24: production commit is ${actual_commit:-unknown}; waiting for ${EXPECTED_COMMIT}"
            sleep 15
          done

          echo "Production did not deploy commit ${EXPECTED_COMMIT} within the verification window." >&2
          exit 1

      - name: Check public site
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/)"
          grep -qi "Synchron" <<< "${page}"

      - name: Check application health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/health \
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Check production readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/health/ready \
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"'

      - name: Check production memory acceptance
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/health/ready)"
          printf '%s' "${response}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const acceptance = JSON.parse(input).checks?.memoryAcceptance;
              console.log(JSON.stringify(acceptance));
              if (
                !acceptance?.required ||
                !acceptance?.ready ||
                acceptance.status !== "works" ||
                acceptance.isolated !== true ||
                acceptance.realMemoryUnchanged !== true ||
                acceptance.cleanupCompleted !== true
              ) {
                process.exit(1);
              }
            });
          '

      - name: Check MCP status
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/health/ready)"
          printf '%s' "${response}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const bridge = JSON.parse(input).checks?.bridge;
              console.log(
                `MCP configured=${Boolean(bridge?.configured)} responding=${Boolean(bridge?.responding)}`,
              );
              if (!bridge?.configured || !bridge?.responding) process.exit(1);
            });
          '

      - name: Check tester auth readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://synchron.foundation/api/auth/session)"
          printf '%s' "${response}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const status = JSON.parse(input);
              const configuration = status.configuration || {};
              console.log(JSON.stringify({
                configured: Boolean(status.configured),
                registrationEnabled: Boolean(status.registrationEnabled),
                projectConnection: Boolean(configuration.projectConnection),
                sessionProtection: Boolean(configuration.sessionProtection),
              }));
              if (
                !status.configured ||
                !status.registrationEnabled ||
                !configuration.projectConnection ||
                !configuration.sessionProtection
              ) {
                process.exit(1);
              }
            });
          '

      - name: Publish production verification status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success)
              state="success"
              description="Production smoke check passed."
              ;;
            failure)
              state="failure"
              description="Production smoke check failed."
              ;;
            *)
              state="error"
              description="Production smoke check did not complete."
              ;;
          esac

          export state description
          payload="$(node -e '
            process.stdout.write(JSON.stringify({
              state: process.env.state,
              context: "synchron/production-smoke",
              description: process.env.description,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            }));
          ')"

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

/* public/styles.css */

html,

.setup-step {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #fff;
}

.setup-step &gt; span {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: #075985;
    background: #e0f2fe;
    font-weight: 800;
}

.setup-step strong,
.setup-step p {
    display: block;
}

.setup-step p {
    margin: 6px 0 12px;
    color: var(--muted);
    line-height: 1.45;
}

.setup-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.setup-note {
    padding: 14px 16px;
    border-radius: 14px;
    color: #78500a;
    background: #fff7df;
    line-height: 1.45;
}

@media (max-width: 520px) {
    .permission-card {
        align-items: flex-start;
    }

    .tool-status-actions,
    .permission-card-actions {
        width: 100%;
        align-items: stretch;
    }

    .tool-connect-btn,
    .permission-info-btn,
    .setup-action {
        width: 100%;
    }
}

/* public/appshell.css */
.app-shell{height:100dvh;display:grid;grid-template-columns:260px minmax(0,1fr);background:#fff}
.sidebar{min-width:0;padding:12px 10px;display:flex;flex-direction:column;gap:8px;color:#212121;background:#f7f7f8;border-right:1px solid #ececec}
.sidebar-brand{min-height:46px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:750}
.sidebar button{width:100%;border:0;cursor:pointer;color:inherit;background:transparent;text-align:left}
.new-chat,.sidebar-nav button{min-height:42px;padding:10px 12px;display:flex;align-items:center;gap:12px;border-radius:10px}
.new-chat:hover,.sidebar-nav button:hover,.conversation:hover,.profile-button:hover{background:#e9e9eb}
.sidebar-nav{display:grid;gap:2px}.sidebar-nav i{width:20px;text-align:center}
.sidebar-section{min-height:0;flex:1;margin-top:14px;overflow-y:auto}
.sidebar-section&gt;span{padding:8px 12px;display:block;color:#707070;font-size:12px;font-weight:650}
.conversation-search{width:calc(100% - 16px);margin:0 8px 7px;padding:9px 10px;border:1px solid #d7d7d7;border-radius:9px;background:#fff;outline:none}
.conversation-list{display:grid;gap:2px}
.conversation{padding:10px 12px;border-radius:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conversation.active{background:#e9e9eb}
.profile-button{min-height:54px;padding:7px 9px;display:grid;grid-template-columns:34px 1fr 20px;align-items:center;gap:9px;border-radius:11px}
.profile-avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#111;font-weight:750}
.profile-button strong,.profile-button small{display:block}.profile-button small{margin-top:2px;color:#777;font-size:11px}
.chatPanel{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:0;border-radius:0;box-shadow:none}
.chat-toolbar{min-height:58px;padding:8px 18px;border:0}.model-title{font-size:18px;font-weight:650}
.model-title i{margin-left:4px;color:#777;font-size:10px}.mobile-menu{display:none;border:0;background:transparent;font-size:18px}
.status-indicator{padding:7px 10px;background:transparent}
#chatMessages{width:min(100%,800px);margin:0 auto;padding:28px 20px 16px}
.message{font-size:16px;line-height:1.65}.message.user{padding:10px 16px;background:#f0f0f0;border-radius:20px}
.assistant-turn{width:100%}.message.agent{padding:8px 0}
.composer-wrap{width:min(100%,800px);margin:0 auto;padding:10px 20px max(10px,env(safe-area-inset-bottom))}
.chat-input-area{min-height:58px;padding:8px 9px;display:flex;align-items:center;gap:5px;border:1px solid #d9d9d9;border-radius:28px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.chat-input-area input{min-width:0;flex:1;border:0;outline:0;padding:8px;color:#222;background:transparent}
.attach-btn,.voice-btn,#sendBtn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border:0;border-radius:50%;cursor:pointer}
.attach-btn,.voice-btn{color:#303030;background:transparent}#sendBtn{color:#fff;background:#111}#sendBtn span{display:none}
.voice-btn.listening{color:#fff;background:#d93025;animation:voice-pulse 1.2s ease-in-out infinite}
@keyframes voice-pulse{50%{box-shadow:0 0 0 6px rgba(217,48,37,.16)}}
.composer-note{padding-top:7px;color:#777;font-size:11px;text-align:center}
.statusPanel{width:340px;max-width:calc(100vw - 24px);position:fixed;top:12px;right:12px;bottom:12px;z-index:50;display:none;overflow:hidden;border:1px solid #ddd;border-radius:16px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.statusPanel.mobile-visible{display:flex}
.sidebar-backdrop{display:none}
.drawer-backdrop{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.28);backdrop-filter:blur(2px)}
.data-drawer{width:min(480px,100vw);position:fixed;inset:0 0 0 auto;z-index:71;display:flex;flex-direction:column;background:#fff;box-shadow:-16px 0 50px rgba(0,0,0,.16)}
.data-drawer[hidden],.drawer-backdrop[hidden]{display:none}
.data-drawer-header{min-height:78px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ececec}
.data-drawer-header h2{margin:2px 0 0;font-size:22px}.data-drawer-kicker{color:#777;font-size:12px}
.data-drawer-header button,.memory-card button{border:0;background:transparent;cursor:pointer}
.data-drawer-header button{width:40px;height:40px;border-radius:50%;font-size:18px}.data-drawer-header button:hover{background:#f0f0f0}
.data-drawer-body{min-width:0;min-height:0;flex:1;padding:18px;overflow-x:hidden;overflow-y:auto}.drawer-state{padding:42px 12px;color:#666;text-align:center}.drawer-error{color:#b42318}
.drawer-section{margin-bottom:24px}.drawer-section h3{margin:0 0 10px;font-size:14px}.drawer-section h3 span{margin-left:5px;color:#777;font-weight:500}
.memory-card,.permission-card{margin-bottom:8px;padding:13px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border:1px solid #e6e6e6;border-radius:12px}
.memory-card p,.permission-card p{margin:0;color:#333;line-height:1.45}.memory-card button{width:32px;height:32px;flex:0 0 32px;color:#777;border-radius:8px}.memory-card button:hover{color:#c0362c;background:#fff0ef}
.drawer-empty{padding:18px;color:#777;border:1px dashed #ddd;border-radius:12px;text-align:center}
.memory-badge{display:inline-flex;margin-bottom:6px;padding:3px 7px;border-radius:999px;background:#e9f2ff;color:#0b63b6;font-size:11px;font-weight:700}
.memory-card&gt;div{min-width:0;flex:1}
.permission-default{margin-bottom:18px;padding:13px 14px;border-radius:12px;background:#f3f6f8;line-height:1.45}.permission-list{display:grid;gap:2px}
.permission-card{align-items:center}.permission-card strong{font-size:13px}.permission-card p{margin-top:4px;color:#666;font-size:12px}.permission-badge{padding:5px 8px;flex:0 0 auto;border-radius:999px;font-size:11px;font-weight:700}
.permission-badge.allow{color:#137333;background:#e6f4ea}.permission-badge.confirm{color:#8a4b00;background:#fff4df}.permission-badge.deny{color:#b42318;background:#feeceb}
.focus-card{margin-bottom:12px;padding:18px;border:1px solid #e3e5e8;border-radius:16px;background:#fff}.focus-card.focus-primary{color:#fff;border-color:#111;background:#111}
.focus-card h3{margin:6px 0 8px;font-size:18px;line-height:1.25}.focus-card p{margin:0;color:#666;line-height:1.5}.focus-card.focus-primary p{color:#d5d5d5}
.focus-kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#777}.focus-primary .focus-kicker{color:#a8c7fa}
.focus-next{padding:15px;border-radius:14px;background:#eef5ff}.focus-next span,.focus-next strong{display:block}.focus-next span{margin-bottom:5px;color:#2765a5;font-size:11px;font-weight:800;text-transform:uppercase}.focus-next strong{line-height:1.45}
.tool-status-card&gt;div{min-width:0}.tool-status-card .permission-badge{max-width:132px;text-align:center}
.work-center-intro{margin-bottom:16px;padding:14px 16px;border-radius:14px;color:#475569;background:#f3f6f8;line-height:1.5}
.work-center-intro p{margin:0}
.work-center-grid{display:grid;gap:10px}
.work-center-card{width:100%;min-width:0;min-height:92px;padding:15px;display:grid;grid-template-columns:44px minmax(0,1fr) 20px;align-items:center;gap:12px;border:1px solid #e2e8f0;border-radius:16px;color:#17212b;background:#fff;font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.work-center-card:hover,.work-center-card:focus-visible{border-color:#aab8c5;box-shadow:0 8px 22px rgba(15,23,42,.08);outline:none}
.work-center-card.featured{color:#fff;border-color:#111;background:#111}
.work-center-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:#111;background:#eef2f6;font-size:20px}
.featured .work-center-icon{color:#111;background:#fff}
.work-center-card-content{min-width:0;display:block}
.work-center-card strong,.work-center-description,.work-center-status{display:block;overflow-wrap:anywhere}
.work-center-card strong{font-size:15px;line-height:1.3}
.work-center-description{margin-top:4px;color:#64748b;font-size:12px;line-height:1.45}
.featured .work-center-description{color:#d6d9de}
.work-center-status{width:fit-content;max-width:100%;margin-top:8px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:750;line-height:1.25}
.work-center-status.external{color:#7c4a03;background:#fff4d7}.work-center-status.internal{color:#137333;background:#e6f4ea}
.work-center-arrow{color:#94a3b8}.featured .work-center-arrow{color:#fff}
.work-center-close{width:100%;min-height:48px;margin-top:8px;border:1px solid #cbd5e1;border-radius:14px;color:#17212b;background:#fff;font:inherit;font-weight:750;cursor:pointer}
@media(max-width:760px){
  .app-shell{display:block}.sidebar{display:none}.sidebar.mobile-visible{width:min(86vw,320px);position:fixed;inset:0 auto 0 0;z-index:60;display:flex;box-shadow:16px 0 50px rgba(0,0,0,.18)}.sidebar-backdrop{position:fixed;inset:0;z-index:59;display:block;background:rgba(0,0,0,.28)}.sidebar-backdrop[hidden]{display:none}.chatPanel{height:100dvh}.mobile-menu{display:block}
  .chat-toolbar{min-height:56px;padding:7px 12px}.status-indicator{padding:6px}#agentStatusText{display:none}
  #chatMessages{padding:18px 14px 8px}.user-turn{max-width:88%}
  .composer-wrap{padding:8px 10px max(8px,env(safe-area-inset-bottom))}
  .data-drawer{width:100vw}
}
@media(max-width:520px){
  .data-drawer-header{min-height:68px;padding:14px 16px}.data-drawer-body{padding:14px}
  .permission-card,.tool-status-card{width:100%;min-width:0;flex-direction:column;align-items:stretch}
  .permission-card&gt;div,.tool-status-card&gt;div{width:100%;min-width:0}
  .permission-card-actions,.tool-status-actions{width:100%;align-items:stretch}
  .tool-status-card .permission-badge{max-width:100%;align-self:flex-start}
  .work-center-card{min-height:104px;grid-template-columns:44px minmax(0,1fr);align-items:start}
  .work-center-arrow{display:none}
}

/* public/search.css */
.search-mode-bar {
  display: flex;
  gap: 8px;
  width: min(820px, calc(100% - 24px));
  margin: 0 auto 8px;
}
.search-mode {
  border: 1px solid #d7dee8;
  background: #fff;
  color: #445064;
  border-radius: 999px;
  padding: 8px 13px;

  font-size: 14px;

}
.search-mode.active {
  border-color: #087cf0;

.attachment-preview img {
    width: 54px;
    height: 54px;
    object-fit: cover;
    border-radius: 10px;
}

.attachment-preview strong,
.attachment-preview span {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.attachment-preview strong {
    font-size: 13px;
}

.attachment-preview span {
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
}

#removeAttachmentBtn {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    color: #4e5c69;
    background: #edf2f6;
    cursor: pointer;
}

.message-image {
    display: block;
    width: min(280px, 100%);
    max-height: 320px;
    margin-bottom: 8px;
    object-fit: contain;
    border-radius: 12px;
}


.tool-status-actions,
.permission-card-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 9px;
    flex: 0 0 auto;
}

.tool-connect-btn,
.permission-info-btn,
.setup-action {
    min-height: 40px;
    padding: 9px 14px;
    border: 1px solid #cbd5df;
    border-radius: 999px;
    color: #14324a;
    background: #f4f8fb;
    font: inherit;
    font-size: 13px;
    font-weight: 750;
    line-height: 1.2;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

.tool-connect-btn {
    color: #075985;
    border-color: #bae6fd;
    background: #eaf8ff;
}

.setup-guide {
    display: grid;
    gap: 14px;
}

.setup-step {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #fff;
}

.setup-step &gt; span {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: #075985;
    background: #e0f2fe;
    font-weight: 800;
}

.setup-step strong,
.setup-step p {
    display: block;
}

.setup-step p {
    margin: 6px 0 12px;
    color: var(--muted);
    line-height: 1.45;
}

.setup-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.setup-note {
    padding: 14px 16px;
    border-radius: 14px;
    color: #78500a;
    background: #fff7df;
    line-height: 1.45;
}

@media (max-width: 520px) {
    .permission-card {
        align-items: flex-start;
    }

    .tool-status-actions,
    .permission-card-actions {
        width: 100%;
        align-items: stretch;
    }

    .tool-connect-btn,
    .permission-info-btn,
    .setup-action {
        width: 100%;
    }
}

.attach-btn,.voice-btn,#sendBtn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border:0;border-radius:50%;cursor:pointer}

.permission-card{align-items:center}.permission-card strong{font-size:13px}.permission-card p{margin-top:4px;color:#666;font-size:12px}.permission-badge{padding:5px 8px;flex:0 0 auto;border-radius:999px;font-size:11px;font-weight:700}

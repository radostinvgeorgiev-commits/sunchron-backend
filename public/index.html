<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#087cf0">
    <title>Synchron-X</title>
    <link rel="stylesheet" href="/styles.css?v=20260724-thinking1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-icon"><i class="fa-solid fa-atom"></i></span>
            <div>
                <div class="brand-name">Synchron-X</div>
                <div class="brand-subtitle">Личен AI разговор</div>
            </div>
        </div>
        <div class="status-indicator" aria-live="polite">
            <span id="agentStatusDot" class="offline"></span>
            <span id="agentStatusText">Свързване…</span>
        </div>
    </header>

    <main class="layout">
        <aside class="panel projectPanel">
            <div class="panel-header">Текущ етап</div>
            <div class="panel-content project-summary">
                <div class="phase-badge">Стъпка 2</div>
                <h2>Стабилен разговор с AI</h2>
                <p>Сега проверяваме разговора. Паметта и модулите ще добавим след това.</p>
            </div>
        </aside>

        <section class="panel chatPanel" id="chat-container">
            <div class="chat-toolbar">
                <div>
                    <strong>Разговор</strong>
                    <span>Пиши директно на твоя AI</span>
                </div>
                <div class="toolbar-actions">
                    <button id="newChatBtn" class="tool-btn" type="button" title="Нов разговор">
                        <i class="fa-solid fa-plus"></i>
                        <span>Нов</span>
                    </button>
                    <button id="toggleStatusBtn" class="tool-btn" type="button" title="Състояние">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>Статус</span>
                    </button>
                </div>
            </div>

            <div id="chatMessages" aria-live="polite"></div>

            <div class="chat-input-area">
                <input
                    type="text"
                    id="chatInput"
                    placeholder="Напиши съобщение…"
                    autocomplete="off"
                    enterkeyhint="send"
                    autofocus
                >
                <button id="sendBtn" type="button" aria-label="Изпрати">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span>Изпрати</span>
                </button>
            </div>
        </section>

        <aside class="panel statusPanel" id="statusPanel" aria-label="Състояние и данни">
            <div class="panel-header status-header">
                <span>Състояние</span>
                <button id="closeContextBtn" class="close-btn" type="button" aria-label="Затвори">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="panel-content">
                <div class="context-box">
                    <div class="context-label">Сесия</div>
                    <div class="context-value" id="sessionIdDisplay">…</div>
                </div>
                <div class="context-box">
                    <div class="context-label">Сървър</div>
                    <div class="context-value" id="serverStatusDisplay">Проверка…</div>
                </div>
                <div class="context-box">
                    <div class="context-label">OpenSearch</div>
                    <div class="context-value" id="opensearchStatusDisplay">Проверка…</div>
                </div>
                <div class="context-label activity-title">Последни действия</div>
                <ul class="log-list" id="actionsLog">
                    <li>Няма скорошни действия</li>
                </ul>
            </div>
        </aside>
    </main>

    <script src="/app.js?v=20260724-thinking1"></script>
</body>
</html>
